<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}The Movie Recommendation Website{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1A; --panel: rgba(16, 26, 46, 0.55); --panel-border: rgba(76, 141, 255, 0.25);
    --surface: rgba(22, 33, 59, 0.55); --border: #26365A; --accent: #4C8DFF;
    --accent-soft: rgba(76, 141, 255, 0.15); --text: #EAF0FF; --text-muted: #7C8BA8;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100vh; position:relative; overflow-x:hidden;
    background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; }
  body { padding: 56px 24px 80px; }
  .bg-glow { position:fixed; inset:0; z-index:0;
    background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(76,141,255,0.18), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 20%, rgba(76,141,255,0.08), transparent 60%),
      radial-gradient(ellipse 600px 400px at 10% 80%, rgba(76,141,255,0.06), transparent 60%), var(--bg);
    background-size:140% 140%; animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { 0%{background-position:0% 0%,0% 0%,0% 0%;} 100%{background-position:4% 6%,-6% -4%,5% -5%;} }
  .snow { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .flake { position:absolute; top:-10px; border-radius:50%; background:#FFF;
    box-shadow:0 0 6px rgba(255,255,255,0.8); opacity:0.95;
    animation-name: fall, sway; animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite; animation-direction: normal, alternate; }
  @keyframes fall { from{transform:translateY(-10vh);} to{transform:translateY(110vh);} }
  @keyframes sway { from{margin-left:-14px;} to{margin-left:14px;} }
  @media (prefers-reduced-motion: reduce) { .bg-glow,.flake{animation:none;} }

  .wrap { max-width: 960px; margin:0 auto; position:relative; z-index:2; }
  header { text-align:center; margin-bottom:32px; }
  .kicker { font-family:'Space Grotesk',sans-serif; font-size:13px; letter-spacing:0.06em; color:var(--accent); margin:0 0 12px; }
  h1 { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(24px,4.5vw,38px); line-height:1.15; margin:0 0 10px; letter-spacing:-0.01em; }
  header p { color:var(--text-muted); font-size:15px; max-width:460px; margin:0 auto; }

  .back-link { display:inline-block; color:var(--text-muted); text-decoration:none; font-size:14px; margin-bottom:20px; }
  .back-link:hover { color:var(--text); }

  .search-wrap { margin:32px auto 0; max-width:640px; }
  .search-row { position:relative; display:flex; align-items:center; background:var(--surface);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--panel-border);
    border-radius:999px; padding:4px; transition:border-color .25s,box-shadow .25s,transform .15s; }
  .search-row:focus-within { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft),0 8px 30px rgba(76,141,255,0.15); transform:translateY(-1px); }
  .search-row svg { flex-shrink:0; width:20px; height:20px; stroke:var(--text-muted); margin-left:18px; pointer-events:none; }
  .search-row input { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:'Inter',sans-serif; font-size:16px; padding:16px 14px; }
  .search-row input::placeholder { color:var(--text-muted); }

  .category-grid { max-width:560px; margin:40px auto 0; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .category-card { display:flex; align-items:center; gap:14px; padding:20px; background:var(--panel);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--panel-border);
    border-radius:16px; text-decoration:none; color:var(--text); transition:transform .2s,box-shadow .2s,border-color .2s; }
  .category-card:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(76,141,255,0.15); border-color:var(--accent); }
  .category-card.active { border-color:var(--accent); background:rgba(76,141,255,0.12); }
  .cat-icon { font-size:26px; line-height:1; }
  .cat-name { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; }
  @media (max-width:560px) { .category-grid { grid-template-columns:1fr; } }

  .letter-row, .year-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:24px 0 8px; }
  .letter-pill, .year-pill { padding:8px 14px; border-radius:999px; background:var(--panel); border:1px solid var(--panel-border);
    color:var(--text-muted); text-decoration:none; font-size:14px; font-weight:500; transition:all .2s; }
  .letter-pill:hover, .year-pill:hover { color:var(--text); border-color:var(--accent); }
  .letter-pill.active, .year-pill.active { background:var(--accent); color:#06101F; border-color:var(--accent); }

  .results-header { margin:44px 0 20px; text-align:center; }
  .results-header p { font-size:13px; letter-spacing:0.03em; color:var(--text-muted); margin:0 0 6px; }
  .results-header h2 { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; margin:0; }
  .results-header h2 span { color:var(--accent); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px; margin-top:24px; }
  .card { position:relative; border-radius:14px; overflow:hidden; aspect-ratio:2/3; background:var(--surface);
    border:1px solid var(--border); text-decoration:none; color:inherit; display:block;
    animation:rise .4s ease backwards; transition:transform .2s ease; }
  .card:hover { transform:translateY(-3px); }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .no-poster { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:16px; text-align:center; background:linear-gradient(160deg,#1B2740,#0F1729); }
  .card .no-poster p { font-size:13px; color:var(--text-muted); margin:0; line-height:1.4; }
  .card .overlay { position:absolute; left:0; right:0; bottom:0; padding:28px 12px 12px; background:linear-gradient(to top,rgba(6,10,20,0.95),transparent); }
  .card .overlay p { margin:0; font-size:13px; font-weight:500; line-height:1.3; }
  .card .overlay .meta { font-size:11px; color:var(--text-muted); margin-top:3px; font-weight:400; }
  @keyframes rise { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

  .empty-msg { color:var(--text-muted); text-align:center; grid-column:1/-1; padding:40px 0; font-size:15px; }

  .pagination { display:flex; justify-content:center; align-items:center; gap:16px; margin-top:32px; color:var(--text-muted); font-size:14px; }
  .pagination a { color:var(--accent); text-decoration:none; font-weight:600; }

  .detail-panel { display:flex; gap:28px; background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--panel-border); border-radius:20px; padding:28px; margin-top:12px; }
  .detail-poster { width:180px; border-radius:12px; flex-shrink:0; object-fit:cover; }
  .detail-info h1 { text-align:left; margin-bottom:8px; }
  .detail-info .meta { color:var(--text-muted); font-size:14px; margin-bottom:14px; }
  .detail-info .overview { font-size:15px; line-height:1.6; color:var(--text); }
  @media (max-width:560px) { .detail-panel { flex-direction:column; } .detail-poster { width:140px; } }

  @media (max-width:520px) { body { padding:40px 16px 60px; } }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
  <div class="bg-glow"></div>
  <div class="snow">
    <div class="flake" style="left:3%;width:5px;height:5px;animation-duration:12s,4s;animation-delay:0s,0s;"></div>
    <div class="flake" style="left:9%;width:7px;height:7px;animation-duration:16s,5s;animation-delay:1s,0.3s;"></div>

    <div class="flake" style="left:22%;width:6px;height:6px;animation-duration:14s,6s;animation-delay:0.5s,1s;"></div>
    <div class="flake" style="left:29%;width:5px;height:5px;animation-duration:11s,4.5s;animation-delay:3s,0.2s;"></div>
    <div class="flake" style="left:36%;width:8px;height:8px;animation-duration:18s,5.5s;animation-delay:1.5s,0.8s;"></div>

    <div class="flake" style="left:57%;width:5px;height:5px;animation-duration:12s,4s;animation-delay:4s,0.6s;"></div>
    <div class="flake" style="left:64%;width:7px;height:7px;animation-duration:17s,6s;animation-delay:1s,0.1s;"></div>

    <div class="flake" style="left:85%;width:5px;height:5px;animation-duration:11s,5s;animation-delay:0.8s,0.7s;"></div>
    <div class="flake" style="left:91%;width:8px;height:8px;animation-duration:19s,6.5s;animation-delay:2.2s,0.2s;"></div>
    <div class="flake" style="left:97%;width:4px;height:4px;animation-duration:9s,3.5s;animation-delay:1.8s,0.5s;"></div>
    <div class="flake" style="left:12%;width:5px;height:5px;animation-duration:14s,5s;animation-delay:5s,0.4s;"></div>
    <div class="flake" style="left:33%;width:6px;height:6px;animation-duration:16s,4.5s;animation-delay:4.5s,0.9s;"></div>
    <div class="flake" style="left:60%;width:4px;height:4px;animation-duration:10s,3s;animation-delay:3.2s,0.1s;"></div>
    <div class="flake" style="left:80%;width:7px;height:7px;animation-duration:15s,5.5s;animation-delay:2.8s,0.6s;"></div>
    <div class="flake" style="left:95%;width:5px;height:5px;animation-duration:12s,4s;animation-delay:1.3s,0.3s;"></div>
  </div>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
