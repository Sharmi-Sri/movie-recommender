{% extends "base.html" %}
{% block content %}
<header>
  <p class="kicker">MOVIE RECOMMENDER</p>
  <h1>The Movie Recommendation Website</h1>
  <p>Search for a movie or browse by category to find your next watch.</p>
</header>

<form action="/search" method="GET">
  <div class="search-wrap">
    <div class="search-row">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" name="q" placeholder="Search for a movie..." autocomplete="off" required>
    </div>
  </div>
</form>

<div class="category-grid">
  <a href="/browse?category=english" class="category-card">
    <span class="cat-icon">🎬</span><span class="cat-name">English Movies</span>
  </a>
  <a href="/browse?category=tamil" class="category-card">
    <span class="cat-icon">🎞️</span><span class="cat-name">Tamil Movies</span>
  </a>
  <a href="/alphabet" class="category-card">
    <span class="cat-icon">🔤</span><span class="cat-name">By Alphabet</span>
  </a>
  <a href="/year" class="category-card">
    <span class="cat-icon">📅</span><span class="cat-name">By Year</span>
  </a>
</div>
{% endblock %}
